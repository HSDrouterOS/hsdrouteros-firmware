name: Build HSD SD-WAN Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget ripgrep

      - name: Clone OpenWrt source (24.10.5)
        run: |
          git clone --depth=1 --branch v24.10.5 https://github.com/openwrt/openwrt.git source

      - name: Prepare feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy customization files
        run: |
          mkdir -p source/files
          cp -r files/* source/files/ || true
          cp customize.sh source/customize.sh
          chmod +x source/customize.sh

      - name: Apply customization
        working-directory: source
        run: ./customize.sh

      - name: Configure target
        working-directory: source
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF
          make defconfig

      - name: Download package sources
        working-directory: source
        run: make download -j8

      - name: Build firmware
        working-directory: source
        run: make -j2 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HSD-SDWAN-firmware
          path: |
            source/bin/targets/**/*
